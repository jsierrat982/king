<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anotador interactivo para el juego de cartas King. Mantiene puntuaciones, calcula subtotales y evita el bloqueo de pantalla.">
    <title>Juego "King"</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Iconos PWA (Actualizado sin espacios) -->
    <link rel="apple-touch-icon" href="./king-icono-2.png">
    <link rel="icon" href="./king-icono-2.png">

    <!-- Enlace al archivo CSS generado por GitHub Actions -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // Script anti-parpadeo (FOUC) para el modo oscuro
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          if (!('theme' in localStorage)) localStorage.theme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          if (!('theme' in localStorage)) localStorage.theme = 'light';
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen p-4 sm:p-8 text-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans">

    <main class="max-w-4xl mx-auto">
        <!-- Controles de Jugadores -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div>
                <label for="p1-name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Jugador 1</label>
                <input type="text" id="p1-name" data-player-id="1" class="player-name-input w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" placeholder="Nombre">
            </div>
            <div>
                <label for="p2-name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Jugador 2</label>
                <input type="text" id="p2-name" data-player-id="2" class="player-name-input w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" placeholder="Nombre">
            </div>
            <div>
                <label for="p3-name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Jugador 3</label>
                <input type="text" id="p3-name" data-player-id="3" class="player-name-input w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" placeholder="Nombre">
            </div>
            <div>
                <label for="p4-name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Jugador 4</label>
                <input type="text" id="p4-name" data-player-id="4" class="player-name-input w-full p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" placeholder="Nombre">
            </div>
        </section>

        <!-- Tabla de Puntuación -->
        <section class="shadow-lg rounded-xl border border-gray-200 dark:border-gray-700 overflow-x-auto">
            <table class="w-full min-w-[600px] border-collapse"> 
                <thead class="bg-gray-100 dark:bg-gray-700">
                    <tr>
                        <th scope="col" class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 p-3 text-left text-sm font-semibold text-gray-600 dark:text-gray-300 rounded-tl-lg">Ronda</th>
                        <th scope="col" id="th-p1" class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 p-3 text-center text-sm font-semibold text-gray-600 dark:text-gray-300">J1</th>
                        <th scope="col" id="th-p2" class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 p-3 text-center text-sm font-semibold text-gray-600 dark:text-gray-300">J2</th>
                        <th scope="col" id="th-p3" class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 p-3 text-center text-sm font-semibold text-gray-600 dark:text-gray-300">J3</th>
                        <th scope="col" id="th-p4" class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 p-3 text-center text-sm font-semibold text-gray-600 dark:text-gray-300 rounded-tr-lg">J4</th>
                    </tr>
                </thead>
                <tbody class="bg-white dark:bg-gray-800" id="score-body">
                    <!-- Rondas Generadas Dinámicamente por JavaScript -->
                </tbody>
                <tfoot>
                    <!-- Subtotal Positivo -->
                    <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700">
                        <td class="p-2 font-semibold text-emerald-600 dark:text-emerald-300 text-sm">Sub Positivo</td>
                        <td id="p1-sub-pos" class="p-2 text-center font-bold">0</td>
                        <td id="p2-sub-pos" class="p-2 text-center font-bold">0</td>
                        <td id="p3-sub-pos" class="p-2 text-center font-bold">0</td>
                        <td id="p4-sub-pos" class="p-2 text-center font-bold">0</td>
                    </tr>
                    <!-- TOTAL FINAL -->
                    <tr class="bg-indigo-100 dark:bg-indigo-900/50">
                        <td class="p-4 font-bold text-lg text-indigo-700 dark:text-indigo-200">TOTAL</td>
                        <td id="p1-total" class="p-4 text-center font-black text-2xl text-indigo-800 dark:text-white transition-colors">0</td>
                        <td id="p2-total" class="p-4 text-center font-black text-2xl text-indigo-800 dark:text-white transition-colors">0</td>
                        <td id="p3-total" class="p-4 text-center font-black text-2xl text-indigo-800 dark:text-white transition-colors">0</td>
                        <td id="p4-total" class="p-4 text-center font-black text-2xl text-indigo-800 dark:text-white transition-colors">0</td>
                    </tr>
                    <!-- Valor en $ -->
                    <tr class="bg-gray-100 dark:bg-gray-700">
                        <td class="p-2 font-medium text-gray-700 dark:text-gray-300 rounded-bl-lg text-sm">
                            <label for="dollar-value-input" class="block mb-1">Valor ($):</label>
                            <input type="text" inputmode="numeric" pattern="[0-9]*" id="dollar-value-input" class="w-20 p-1 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0">
                        </td>
                        <td id="p1-dollar-total" class="p-2 text-center font-bold text-blue-600 dark:text-blue-300">$0</td>
                        <td id="p2-dollar-total" class="p-2 text-center font-bold text-blue-600 dark:text-blue-300">$0</td>
                        <td id="p3-dollar-total" class="p-2 text-center font-bold text-blue-600 dark:text-blue-300">$0</td>
                        <td id="p4-dollar-total" class="p-2 text-center font-bold text-blue-600 dark:text-blue-300 rounded-br-lg">$0</td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <!-- Botones de Control -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6">
            <button id="reset-scores-btn" class="px-4 py-3 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reiniciar Puntos
            </button>
            <button id="reset-all-btn" class="px-4 py-3 bg-red-700 hover:bg-red-800 text-white font-medium rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Borrar Todo
            </button>
            <button id="wake-lock-btn" class="px-4 py-3 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                <span>💡</span> <span id="wake-status">Desbloquear Pantalla</span>
            </button>
        </section>
    </main>

    <footer class="mt-12 text-center text-xs text-gray-500 dark:text-gray-400 pb-6">
        <p>&copy; 2026 Julián Sierra T.</p>
    </footer>

    <script>
        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('Error SW:', err));
            });
        }

        // Definición de las rondas para generación dinámica
        const roundsData = [
            { id: 1, name: "1. NO Bases", value: -20, max: 13 },
            { id: 2, name: "2. NO ❤️", value: -20, max: 13 },
            { id: 3, name: "3. NO Js Ks", value: -30, max: 8 },
            { id: 4, name: "4. NO Qs", value: -50, max: 4 },
            { id: 5, name: "5. NO K❤️", value: -160, max: 1 },
            { id: 6, name: "6. NO 2 Ultimas", value: -90, max: 2 },
            { type: 'sub-neg' }, // Fila separadora
            { id: 7, name: "7. Positivas", value: 25, max: 13 },
            { id: 8, name: "8. Positivas", value: 25, max: 13 },
            { id: 9, name: "9. Positivas", value: 25, max: 13 },
            { id: 10, name: "10. Positivas", value: 25, max: 13 }
        ];

        // Función para inyectar las filas en el HTML dinámicamente
        function renderTableRows() {
            const tbody = document.getElementById('score-body');
            let html = '';

            roundsData.forEach(round => {
                if (round.type === 'sub-neg') {
                    html += `
                        <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700">
                            <td class="p-2 font-semibold text-indigo-500 dark:text-indigo-300 text-sm">Sub Negativo</td>
                            <td id="p1-sub-neg" class="p-2 text-center font-bold">0</td>
                            <td id="p2-sub-neg" class="p-2 text-center font-bold">0</td>
                            <td id="p3-sub-neg" class="p-2 text-center font-bold">0</td>
                            <td id="p4-sub-neg" class="p-2 text-center font-bold">0</td>
                        </tr>
                    `;
                    return;
                }

                // Generar opciones del select basado en el max
                let options = '';
                for(let i = 0; i <= round.max; i++) {
                    options += `<option value="${i}">${i}</option>`;
                }

                const sign = round.value > 0 ? '+' : '';
                html += `
                    <tr class="border-b border-gray-200 dark:border-gray-700 transition-colors" id="row-r${round.id}">
                        <td class="p-2 text-sm font-medium" scope="row">${round.name} (${sign}${round.value})</td>
                        ${[1, 2, 3, 4].map(player => `
                            <td class="p-2 text-center">
                                <select id="p${player}-r${round.id}" data-round="${round.id}" data-player="${player}" class="score-input" aria-label="Puntuación Jugador ${player} Ronda ${round.id}">
                                    ${options}
                                </select>
                            </td>
                        `).join('')}
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Renderizamos la tabla antes de inicializar los listeners
            renderTableRows();

            const scoreInputs = document.querySelectorAll('.score-input');
            const playerNameInputs = document.querySelectorAll('.player-name-input');
            const resetScoresBtn = document.getElementById('reset-scores-btn');
            const resetAllBtn = document.getElementById('reset-all-btn');
            const dollarInput = document.getElementById('dollar-value-input');
            const wakeLockBtn = document.getElementById('wake-lock-btn');
            const wakeStatus = document.getElementById('wake-status');
            
            let wakeLock = null;

            // --- Lógica Wake Lock ---
            async function toggleWakeLock() {
                if ('wakeLock' in navigator) {
                    if (wakeLock === null) {
                        try {
                            wakeLock = await navigator.wakeLock.request('screen');
                            wakeStatus.textContent = "Pantalla: Activa";
                            wakeLockBtn.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                            wakeLockBtn.classList.add('bg-yellow-400', 'text-black');
                            
                            wakeLock.addEventListener('release', () => {
                                wakeLock = null;
                                updateWakeUI(false);
                            });
                        } catch (err) {
                            console.error(`${err.name}, ${err.message}`);
                        }
                    } else {
                        wakeLock.release();
                    }
                } else {
                    alert('Tu navegador no soporta esta función.');
                }
            }

            function updateWakeUI(isActive) {
                if (!isActive) {
                    wakeStatus.textContent = "Desbloquear Pantalla";
                    wakeLockBtn.classList.add('bg-gray-200', 'dark:bg-gray-700');
                    wakeLockBtn.classList.remove('bg-yellow-400', 'text-black');
                }
            }
            if(wakeLockBtn) wakeLockBtn.addEventListener('click', toggleWakeLock);

            // --- Persistencia con LocalStorage ---
            function saveData() {
                const state = { players: {}, scores: {}, dollarValue: dollarInput ? dollarInput.value : 0 };
                playerNameInputs.forEach(input => state.players[input.id] = input.value);
                scoreInputs.forEach(input => state.scores[input.id] = input.value);
                localStorage.setItem('kingGameState', JSON.stringify(state));
            }

            function loadData() {
                const saved = localStorage.getItem('kingGameState');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (dollarInput && state.dollarValue) dollarInput.value = state.dollarValue;
                    playerNameInputs.forEach(input => { if (state.players[input.id]) input.value = state.players[input.id]; });
                    scoreInputs.forEach(input => { if (state.scores[input.id]) input.value = state.scores[input.id]; });
                }
            }

            // --- Lógica del Juego ---
            function calculateScores() {
                let playerTotals = { 1: 0, 2: 0, 3: 0, 4: 0 };
                let playerSubNeg = { 1: 0, 2: 0, 3: 0, 4: 0 };
                let playerSubPos = { 1: 0, 2: 0, 3: 0, 4: 0 };

                const roundConfigs = roundsData.filter(r => r.id);

                roundConfigs.forEach(round => {
                    let roundSum = 0;
                    for (let player = 1; player <= 4; player++) {
                        const input = document.getElementById(`p${player}-r${round.id}`);
                        const value = parseInt(input.value, 10) || 0;
                        roundSum += value;
                        const score = value * round.value;
                        playerTotals[player] += score;
                        if (round.id <= 6) playerSubNeg[player] += score;
                        else playerSubPos[player] += score;
                    }

                    const roundRow = document.getElementById(`row-r${round.id}`);
                    roundRow.classList.remove('bg-red-200', 'dark:bg-red-800/50');
                    if (roundSum > 0 && roundSum !== round.max) {
                        roundRow.classList.add('bg-red-200', 'dark:bg-red-800/50');
                    }
                });

                for (let player = 1; player <= 4; player++) {
                    document.getElementById(`p${player}-total`).textContent = playerTotals[player];
                    document.getElementById(`p${player}-sub-neg`).textContent = playerSubNeg[player];
                    document.getElementById(`p${player}-sub-pos`).textContent = playerSubPos[player];
                }

                const dollarValue = parseFloat(document.getElementById('dollar-value-input').value) || 0;
                for (let player = 1; player <= 4; player++) {
                    const dollarTotal = playerTotals[player] * dollarValue;
                    document.getElementById(`p${player}-dollar-total`).textContent = `$${dollarTotal.toFixed(0)}`;
                }
                
                highlightWinner(playerTotals);
                saveData(); // Guardar estado tras calcular
            }

            function updatePlayerHeaders() {
                playerNameInputs.forEach(input => {
                    const playerId = input.dataset.playerId;
                    const th = document.getElementById(`th-p${playerId}`);
                    if (th) {
                        const name = input.value.trim();
                        th.textContent = name ? name.substring(0, 3).toUpperCase() : `J${playerId}`;
                    }
                });
                saveData(); // Guardar estado tras cambiar un nombre
            }

            function highlightWinner(totals) {
                const defaultColors = ['text-indigo-800', 'dark:text-white'];
                const positiveColors = ['text-green-600', 'dark:text-green-400'];
                const negativeColors = ['text-red-600', 'dark:text-red-400'];
                const allColorClasses = [...defaultColors, ...positiveColors, ...negativeColors];

                for (let player = 1; player <= 4; player++) {
                    const totalEl = document.getElementById(`p${player}-total`);
                    const score = totals[player];
                    totalEl.classList.remove(...allColorClasses);
                    if (score > 0) totalEl.classList.add(...positiveColors);
                    else if (score < 0) totalEl.classList.add(...negativeColors);
                    else totalEl.classList.add(...defaultColors);
                }
            }

            // --- Acciones de Reinicio ---
            function resetScoresOnly() {
                if (!confirm('¿Mantener nombres y borrar SOLO los puntos?')) return;
                scoreInputs.forEach(input => input.value = '0');
                calculateScores();
            }

            function resetAll() {
                if (!confirm('¿BORRAR TODO? Se perderán nombres y configuraciones.')) return;
                scoreInputs.forEach(input => input.value = '0');
                playerNameInputs.forEach(input => input.value = '');
                if(dollarInput) dollarInput.value = '';
                
                localStorage.removeItem('kingGameState'); // Limpiar caché
                calculateScores();
                updatePlayerHeaders();
            }

            // Listeners
            scoreInputs.forEach(input => input.addEventListener('change', calculateScores));
            playerNameInputs.forEach(input => input.addEventListener('input', updatePlayerHeaders));
            resetScoresBtn.addEventListener('click', resetScoresOnly);
            resetAllBtn.addEventListener('click', resetAll);
            if (dollarInput) dollarInput.addEventListener('input', calculateScores);

            // Inicialización final
            loadData();
            calculateScores();
            updatePlayerHeaders();
        });
    </script>
</body>
</html>
