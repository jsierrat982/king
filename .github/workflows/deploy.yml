name: Deploy King App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar Tailwind CSS
        run: npm install -D tailwindcss
        
      - name: Compilar CSS para producción
        # Lee el input.css, escanea el index.html y genera el style.css minificado
        run: npx tailwindcss -i ./input.css -o ./style.css --content "./*.html" --minify
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
