name: Deploy King App to GitHub Pages

on:
  # Se ejecuta cada vez que haces un push a la rama main
  push:
    branches: ["main"]
  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para que GitHub Actions pueda publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar Tailwind CSS
        # Instalamos tailwindcss directamente sin necesidad de package.json
        run: npm install -D tailwindcss
        
      - name: Compilar CSS para producción
        # Compilamos minificando el código para máximo rendimiento
        run: npx tailwindcss -i ./input.css -o ./style.css --minify
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todos los archivos del repositorio (incluyendo el nuevo style.css)
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
